name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build MBFU_GUI.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --uac-admin --noupx --name MBFU_GUI
          --icon "${{ github.workspace }}/MBFU.ico"
          --version-file "${{ github.workspace }}/version_info.txt"
          --distpath MBFU_clean --workpath build-tmp --specpath build-tmp
          MBFU_clean/MBFU_GUI.py

      - name: Pack portable code zip
        shell: pwsh
        run: Compress-Archive -Path MBFU_clean -DestinationPath MBFU-portable-code.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            MBFU_clean/MBFU_GUI.exe
            MBFU-portable-code.zip

      - name: Draft GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          --draft --title "${{ github.ref_name }}"
          --notes "Кодовая сборка (без проприетарной нагрузки, см. PAYLOAD.md)."
          MBFU_clean/MBFU_GUI.exe MBFU-portable-code.zip
